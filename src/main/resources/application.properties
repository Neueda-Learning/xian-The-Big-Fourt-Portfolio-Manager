spring.application.name=xian-The-Big-Fourt-Portfolio-Manager
server.port=9001

# Database Configuration - Using H2 in-memory database for development
# To use MySQL instead: 
#  1. Start MySQL: mysql -u root -p
#  2. Create database: CREATE DATABASE portfolio_db;
#  3. Uncomment MySQL lines below and comment out H2 lines

# H2 In-Memory Database (No setup required)
spring.datasource.url=jdbc:h2:mem:portfolio_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# MySQL Configuration (Commented out - uncomment to use MySQL)
# spring.datasource.url=jdbc:mysql://localhost:3306/portfolio_db?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
# spring.datasource.username=root
# spring.datasource.password=n3u3da!
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
yahoo.finance.base-url=https://c4rm9elh30.execute-api.us-east-1.amazonaws.com/default/cachedPriceData

app.ai.enabled=true
app.ai.provider=zhipu
app.ai.base-url=https://open.bigmodel.cn/api/paas/v4
app.ai.chat-path=/chat/completions
# Zhipu API key is read from an environment variable only; never commit it to source control or expose it to the frontend.
app.ai.api-key=f87e5e15ccc344768217b5475c813c14.5jMrrNDCfUF3xvDE
# Backend-maintained allow-list of Zhipu models the frontend may select; the frontend only reads the safe options exposed here.
app.ai.models=${ZHIPU_MODELS:glm-4.7-flash, glm-4.7, glm-5.2}
# The default model is also determined by backend configuration; if not in models, the code falls back to the first available model.
app.ai.default-model=${ZHIPU_DEFAULT_MODEL:glm-4.7-flash}
# Optimized settings for faster response times
app.ai.temperature=0.5
app.ai.max-tokens=500
app.ai.connect-timeout=3000
app.ai.read-timeout=15000
