# Test configuration - isolated in-memory DB so test context does not pollute main app data
spring.datasource.url=jdbc:h2:mem:test_portfolio_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
server.port=0